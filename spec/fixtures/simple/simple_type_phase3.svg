<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="647" height="603" viewBox="0 0 647 603">
  <style>.xsd-symbol {
  cursor: pointer;
  pointer-events: all;
}

.xsd-symbol.symbol-hover .symbol-shape {
  stroke-width: 3;
  filter: drop-shadow(0 0 5px rgba(0,0,0,0.3));
}

.symbol-shape {
  stroke-width: 1;
  transition: stroke-width 0.2s, filter 0.2s;
}

.type-link {
  cursor: pointer;
  text-decoration: underline;
}

.type-link:hover {
  fill: #0000CC;
}

.collapse-button {
  cursor: pointer;
}

.collapse-button:hover circle {
  fill: #F0F0F0;
}

.child-group {
  display: block;
}

.menu-button {
  cursor: pointer;
}

.menu-button:hover .menu-dot {
  fill: #333333;
}

.special-char {
  font-weight: bold;
}

/* Shadow for depth effect */
.shadow {
  fill: #ccccd8;
  stroke: none;
}

/* Connection circle styles */
.connection-input {
  fill: #4CAF50;
  stroke: #388E3C;
  stroke-width: 1;
}

.connection-output {
  fill: #2196F3;
  stroke: #1976D2;
  stroke-width: 1;
}

/* Compositor internal line */
.compositor-line {
  stroke: #000;
  stroke-width: 1;
  fill: none;
}

/* Element styles - XSDVI light yellow */
.xsd-element .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Complex Type styles - XSDVI light yellow */
.xsd-complex-type .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Simple Type styles - XSDVI light yellow */
.xsd-simple-type .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Compositor styles (sequence, choice, all) - XSDVI light blue */
.xsd-sequence .symbol-shape,
.xsd-choice .symbol-shape,
.xsd-all .symbol-shape {
  fill: #E7EBF3;
  stroke: #666677;
}

/* Group styles */
.xsd-group .symbol-shape {
  fill: #E7EBF3;
  stroke: #666677;
}

/* Attribute styles - XSDVI light yellow */
.xsd-attribute .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Attribute Group styles */
.xsd-attribute-group .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Restriction styles */
.xsd-restriction .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Extension styles */
.xsd-extension .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Union styles */
.xsd-union .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* List styles */
.xsd-list .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Any styles */
.xsd-any .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* AnyAttribute styles */
.xsd-any-attribute .symbol-shape {
  fill: #FFFFBB;
  stroke: #776633;
}

/* Identity constraint styles */
.xsd-key .symbol-shape,
.xsd-unique .symbol-shape,
.xsd-keyref .symbol-shape {
  fill: #E7EBF3;
  stroke: #666677;
}

/* Selector and Field styles */
.xsd-selector .symbol-shape,
.xsd-field .symbol-shape {
  fill: #E7EBF3;
  stroke: #666677;
}

/* Attribute styling based on required/optional */
.attribute-required {
  stroke-width: 2;
  stroke-dasharray: none;
}

.attribute-optional {
  stroke-width: 1;
  stroke-dasharray: 4,2;
}

/* Text styles matching XSDVI */
.symbol-name {
  fill: #000;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
}

.symbol-type {
  fill: #000;
  font-family: Arial, sans-serif;
  font-size: 11px;
  pointer-events: none;
}

.small {
  font-size: 10px;
}

/* Connector styles - XSDVI gray */
.connector {
  stroke: #666666;
  stroke-width: 1;
  fill: none;
}

/* XSDVI Button styles */
.button rect {
  fill: #FFFFFF;
  stroke: #000000;
  stroke-width: 1;
}

.button line {
  stroke: #000000;
  stroke-width: 1;
}

/* Connection line styles */
.connection {
  stroke: #666666;
  stroke-width: 1;
  fill: none;
}

/* Box class for XSDVI compatibility */
.box {
  cursor: pointer;
}
</style>
  <script>function toggleChildren(symbolId) {
  var childGroup = document.getElementById(symbolId + '_children');
  if (childGroup) {
    var isHidden = childGroup.style.display === 'none';
    childGroup.style.display = isHidden ? 'block' : 'none';

    // Update button text
    var button = document.querySelector('#' + symbolId + ' .collapse-button text');
    if (button) {
      button.textContent = isHidden ? '-' : '+';
    }
  }
}

// Add mouseover effects for alternate display
document.addEventListener('DOMContentLoaded', function() {
  var symbols = document.querySelectorAll('.xsd-symbol');
  symbols.forEach(function(symbol) {
    symbol.addEventListener('mouseenter', function() {
      this.classList.add('symbol-hover');
    });
    symbol.addEventListener('mouseleave', function() {
      this.classList.remove('symbol-hover');
    });
  });
});
</script>
